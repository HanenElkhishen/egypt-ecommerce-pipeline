version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: price_egp
        data_tests:
          - not_null
          - positive_value

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'shipped', 'cancelled', 'returned']

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: quantity
        data_tests:
          - positive_value
      - name: unit_price_egp
        data_tests:
          - positive_value