workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - dbt
  - package
  - deploy_dev
  - deploy_prod

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-cache
  paths:
    - .cache/pip

lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - pip install ruff
    - ruff check .
    - ruff format --check .

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - pip install -r requirements-dev.txt
    - pytest -v

dbt_build:
  stage: dbt
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  services:
    - postgres:16
  variables:
    POSTGRES_DB: ecommerce
    POSTGRES_USER: ci_user
    POSTGRES_PASSWORD: ci_password
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    PGPASSWORD: ci_password
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - pip install -r requirements.txt -r requirements-dbt.txt
  script:
    - psql -v ON_ERROR_STOP=1 -h postgres -U ci_user -d ecommerce -f docker/init/01_create_schemas.sql
    - python ingestion/generate_and_load.py
    - python ingestion/check_raw.py
    - cd dbt_project
    - dbt source freshness --profiles-dir .
    - dbt build --profiles-dir .
    - dbt docs generate --profiles-dir .
  artifacts:
    when: always
    paths:
      - dbt_project/target/run_results.json
      - dbt_project/target/index.html
      - dbt_project/target/manifest.json
      - dbt_project/target/catalog.json
      - dbt_project/logs/
    expire_in: 1 week

build_image:
  stage: package
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

pages:
  stage: package
  needs: [dbt_build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  script:
    - mkdir -p public
    - cp dbt_project/target/index.html dbt_project/target/manifest.json dbt_project/target/catalog.json public/
  pages: true
  artifacts:
    paths:
      - public

.deploy:
  image:
    name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    POSTGRES_PORT: "5432"
    PGSSLMODE: require
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  script:
    - cd /app
    - python ingestion/generate_and_load.py
    - cd dbt_project
    - dbt build --profiles-dir .

deploy_dev:
  extends: .deploy
  stage: deploy_dev
  environment:
    name: dev

deploy_prod:
  extends: .deploy
  stage: deploy_prod
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: false

scheduled_refresh:
  extends: .deploy
  stage: deploy_dev
  image:
    name: $CI_REGISTRY_IMAGE:latest
    entrypoint: [""]
  environment:
    name: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cd /app
    - python ingestion/generate_and_load.py
    - cd dbt_project
    - dbt source freshness --profiles-dir .
    - dbt build --profiles-dir .